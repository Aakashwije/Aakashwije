name: 🐍 Feed the grass-eating snake

on:
  schedule:
    - cron: "0 */12 * * *" # twice a day
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate sakura-themed snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#a855f7&color_dots=#ebedf0,#ffd6e8,#ffa3cf,#ff6ec7,#d6249f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00e5ff&color_dots=#161b22,#3b1747,#6d2077,#b8329f,#ff6ec7

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
